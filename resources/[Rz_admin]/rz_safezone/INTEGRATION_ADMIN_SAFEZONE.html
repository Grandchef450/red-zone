     REDZONE — Bouton « Zones sûres »

     À COLLER dans : resources/[Script]/admin/Nui/index.html
     JUSTE AVANT </body>

     Si tu as déjà collé le bloc du Craft Creator, ajoute celui-ci
     juste en dessous : les deux cohabitent sans se gêner.
     ═══════════════════════════════════════════════════════════════ -->

<script>
(function () {
    'use strict';

    var MENU_SELECTOR = '.sidebar .menu';
    var ITEM_ID       = 'rz-safezones';

    function injectButton() {
        var menu = document.querySelector(MENU_SELECTOR);
        if (!menu || document.getElementById(ITEM_ID)) return;

        var li = document.createElement('li');
        li.id = ITEM_ID;
        li.innerHTML =
            '<span class="icon"><i class="fa-solid fa-shield-halved"></i></span>' +
            '<span class="label">Zones sûres</span>';

        li.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();

            fetch('https://' + GetParentResourceName() + '/close', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json; charset=UTF-8' },
                body: JSON.stringify({})
            }).catch(function () {});

            fetch('https://rz_safezone/openSafezones', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json; charset=UTF-8' },
                body: JSON.stringify({})
            }).catch(function () {});
        });

        menu.appendChild(li);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', injectButton);
    } else {
        injectButton();
    }

    new MutationObserver(injectButton).observe(document.body, {
        childList: true, subtree: true
    });
})();
</script>
