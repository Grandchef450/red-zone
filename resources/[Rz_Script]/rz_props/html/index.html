<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="hidden">
        <div class="header">
            <span class="title">RZ — Placement de props</span>
            <button id="close" class="x">&times;</button>
        </div>

        <div class="placer">
            <div class="field">
                <label>Modèle (preset ou libre)</label>
                <div class="model-row">
                    <select id="preset"></select>
                    <input type="text" id="model" placeholder="prop_tool_bench02" autocomplete="off">
                </div>
            </div>
            <div class="field">
                <label>Nom du prop</label>
                <input type="text" id="name" placeholder="Ex: Établi armurerie" maxlength="40">
            </div>
            <div class="btn-row">
                <button id="place" class="btn-place">Placer en jeu</button>
                <button id="savePreset" class="btn-secondary" title="Ajoute ce modèle à la liste des raccourcis, sans le placer">+ Raccourci</button>
            </div>
        </div>

        <div class="list-title"><span id="presetCount">Raccourcis ajoutés</span></div>
        <div class="list list-presets" id="presetList"></div>

        <div class="list-title"><span id="count">Props posés</span></div>
        <div class="list" id="list"></div>

        <div class="toast" id="toast"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
