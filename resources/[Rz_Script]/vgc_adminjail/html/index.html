<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Jail</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ═══ OVERLAY JOUEUR EMPRISONNÉ (haut de l'écran, sans focus) ═══ -->
    <div id="jail-overlay" class="hidden">
        <div class="jo-bar">
            <div class="jo-icon">⛓</div>
            <div class="jo-center">
                <div class="jo-title">PRISON ADMIN</div>
                <div class="jo-reason" id="jo-reason"></div>
            </div>
            <div class="jo-time" id="jo-time">0:00</div>
        </div>
        <div class="jo-progress"><div class="jo-progress-fill" id="jo-fill"></div></div>
        <div class="jo-leash hidden" id="jo-leash">⚠ Reste dans la zone !</div>
    </div>

    <!-- Lecteur audio (boucle) — jamais visible -->
    <audio id="jail-audio" loop></audio>

    <!-- ═══ PANNEAU ADMIN ═══ -->
    <div id="panel" class="hidden">
        <div class="p-window">
            <div class="p-header">
                <div class="p-title">⛓ ADMIN JAIL <span class="p-max" id="p-max">max 5:00</span></div>
                <button class="p-close" id="p-close">✕</button>
            </div>

            <div class="p-body">
                <!-- Colonne gauche : nouveau jail -->
                <div class="p-col">
                    <div class="p-section">JOUEUR À EMPRISONNER</div>
                    <select id="j-player" class="p-select"></select>

                    <div class="p-section">DURÉE <span id="j-dur-label" class="p-val">2:00</span></div>
                    <input type="range" id="j-duration" min="10" max="300" step="10" value="120" class="p-slider">

                    <div class="p-section">LIEU DE LA PRISON</div>
                    <select id="j-location" class="p-select"></select>
                    <div class="p-coords hidden" id="j-custom-coords">
                        <input type="number" step="0.01" id="j-x" placeholder="X">
                        <input type="number" step="0.01" id="j-y" placeholder="Y">
                        <input type="number" step="0.01" id="j-z" placeholder="Z">
                    </div>

                    <div class="p-section">MUSIQUE EN BOUCLE (optionnel)</div>
                    <select id="j-music-preset" class="p-select"></select>
                    <input type="text" id="j-music-url" class="p-input" placeholder="ou URL directe .mp3 / .ogg" spellcheck="false">
                    <div class="p-row">
                        <span class="p-mini">Volume</span>
                        <input type="range" id="j-volume" min="0" max="1" step="0.05" value="0.6" class="p-slider small">
                        <span class="p-mini" id="j-vol-label">60%</span>
                    </div>

                    <div class="p-section">RAISON (optionnel)</div>
                    <input type="text" id="j-reason" class="p-input" placeholder="ex: spam mic, VDM…" maxlength="100">

                    <button class="btn-jail" id="btn-jail">⛓ EMPRISONNER</button>
                </div>

                <!-- Colonne droite : peines actives -->
                <div class="p-col">
                    <div class="p-section-row">
                        <div class="p-section">PEINES ACTIVES</div>
                        <button class="btn-sm" id="btn-refresh">↺</button>
                    </div>
                    <div id="j-active-list" class="j-list"></div>
                </div>
            </div>
        </div>
        <div class="toast" id="toast"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
