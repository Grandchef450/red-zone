# ───────────────────────────────────────────────────────────────────
#  IDENTITÉ DU SERVEUR
# ───────────────────────────────────────────────────────────────────
    sv_hostname "RedZone Survival / Loot / Craft - Serveur Post-Apocalyptique"
    sets sv_projectName "RedZone Survival"
    sets sv_projectDesc "RedZone — La Survie Humaine dépend de vous"
    sets locale "fr-CA"

    sets Fondateur "GrandchefStream"
    sets Developpeur "VoigthQC"
    sets Discord "https://discord.gg/KtxyBudf"

    sets tags "custom, fr, qc, survival, post-apocalyptique, craft, zombies"

    sets banner_detail "https://i.postimg.cc/vTB17b0f/Redzone_ban.png"
    sets banner_connecting "https://i.postimg.cc/5y60YptB/redzone-rond-logo.png"
    load_server_icon redzone_logo.png


# ───────────────────────────────────────────────────────────────────
#  RÉSEAU ET LICENCE
#  ⚠️  NE JAMAIS COMMIT CE FICHIER AVEC LES VRAIES VALEURS
# ───────────────────────────────────────────────────────────────────
    sv_licenseKey "XXXXX"
    set steam_webApiKey "XXXXX"

    sv_enforceGameBuild 3570

    # ⚠️  MODE DÉVELOPPEMENT — À CHANGER AVANT L'OUVERTURE PUBLIQUE
    sv_lan 1                # → 0 pour autoriser les connexions extérieures
    sv_maxclients 4         # → 32/48/64 selon ton hébergement

    endpoint_add_tcp "0.0.0.0:31120"
    endpoint_add_udp "0.0.0.0:31120"

    set resources_useSystemChat true

    # ⚠️  OneSync est OBLIGATOIRE pour Qbox. À activer dans l'onglet
    #     Settings de txAdmin, pas ici. Sans lui, qbx_core refuse de
    #     démarrer : il le déclare en dépendance dans son manifeste.


# ───────────────────────────────────────────────────────────────────
#  POOLS MÉMOIRE
# ───────────────────────────────────────────────────────────────────
    increase_pool_size "TxdStore" 6000              # Max: 26000
    # increase_pool_size "FragmentStore" 14000      # Max: 14000
    # increase_pool_size "StaticBounds" 5000        # Max: 5000
    # increase_pool_size "CMoveObject" 75           # Max: 75


# ═══════════════════════════════════════════════════════════════════
#  CONVARS DE FRAMEWORK
#
#  ox_inventory choisit son pont par ce convar. Sans cette ligne il
#  démarre en mode ESX et plus rien ne fonctionne.
#  ox_target, lui, détecte Qbox tout seul.
# ═══════════════════════════════════════════════════════════════════
    setr inventory:framework "qbx"
    setr inventory:locale "fr"

    # Capacité de transport du joueur, en GRAMMES.
    # 120 000 g garantit au moins 200 unités de n'importe quel
    # matériau : aucun item empilable ne dépasse 600 g.
    setr inventory:weight 120000


# ═══════════════════════════════════════════════════════════════════
#  LOOT DE RÉCUPÉRATION
#
#  Format d'une entrée : ["item", minimum, maximum, chance en %]
#  À chaque fouille, ox_inventory tire de 0 à 3 items et lance un
#  jet séparé pour chacun. Une chance de 70 ne veut donc PAS dire
#  70 % de trouver l'item : il faut d'abord qu'il soit tiré.
#
#  ⚠️  DEUX PIÈGES DE SYNTAXE
#   1. Chaque ligne doit rester sur UNE SEULE LIGNE. Un JSON coupé
#      sur plusieurs lignes n'est pas lu par FiveM.
#   2. Les guillemets internes sont échappés par \" — sans quoi le
#      parseur coupe la valeur au premier guillemet et le convar
#      arrive tronqué, sans la moindre erreur en console.
# ═══════════════════════════════════════════════════════════════════

    # Épaves et véhicules abandonnés : pièces mécaniques et matériaux
    setr inventory:vehicleloot "[[\"ferraille\",1,3,70],[\"plastique\",1,3,65],[\"caoutchouc\",1,2,60],[\"fil_fer\",1,2,55],[\"tissu_use\",1,2,55],[\"ressort\",1,3,50],[\"verre\",1,2,45],[\"elastique\",1,2,40],[\"ruban_adhesif\",1,1,35],[\"tuyau_caoutchouc\",1,1,30],[\"tuyau_plastique\",1,1,30],[\"tube_cuivre\",1,1,25],[\"batterie_usee\",1,1,25],[\"bouteille_eau_sale\",1,1,20],[\"colle_construction\",1,1,15],[\"cle_molette\",1,1,12],[\"cle_cric\",1,1,10]]"

    # Poubelles et bennes : déchets domestiques, avec de rares trouvailles
    setr inventory:dumpsterloot "[[\"carton\",1,3,75],[\"plastique\",1,3,70],[\"tissu_use\",1,2,60],[\"ficelle\",1,2,50],[\"bouteille_eau_sale\",1,2,45],[\"morceau_bois\",1,2,40],[\"verre\",1,2,40],[\"elastique\",1,2,35],[\"ferraille\",1,2,35],[\"chaussette_blanche\",1,1,30],[\"sel\",1,1,20],[\"cafe_colombien_sachet\",1,1,15],[\"cafe_moulu_sachet\",1,1,15],[\"aiguille_crochet\",1,1,12],[\"batterie_usee\",1,1,8],[\"collier_argent\",1,1,3],[\"bracelet_or\",1,1,2]]"

    # Active le tirage aléatoire (1 par défaut, mais autant l'écrire)
    setr inventory:randomloot 1

    # ─── DÉLAI DE RÉGÉNÉRATION ────────────────────────────────────
    # Minutes avant qu'une benne fouillée soit vidée de la mémoire
    # et propose un nouveau tirage. Défaut ox_inventory : 5, ce qui
    # permet de camper trois poubelles et de farmer sans bouger.
    #
    # ⚠️  Ce convar ne s'applique QU'AUX BENNES. Les coffres de
    #     véhicule sont gérés par rz_core/server/loot.lua, dont la
    #     valeur Config.LootRespawn.minutes doit rester alignée.
    setr inventory:cleartime 45


# ───────────────────────────────────────────────────────────────────
#  BASE FIVEM
# ───────────────────────────────────────────────────────────────────
    ensure mapmanager
    ensure chat
    ensure sessionmanager
    ensure hardcap
    # ensure spawnmanager      # désactivé : qbx_core gère le spawn
    # ensure basic-gamemode    # désactivé : incompatible avec un framework


# ───────────────────────────────────────────────────────────────────
#  PERMISSIONS
#  Le préfixe @ressource/ est obligatoire : sans lui, FiveM cherche
#  le fichier à la racine du serveur et l'exec échoue silencieusement.
# ───────────────────────────────────────────────────────────────────
    exec @vMenu/config/permissions.cfg


# ───────────────────────────────────────────────────────────────────
#  FRAMEWORK QBOX — DOIT DÉMARRER AVANT TOUT SCRIPT
#  L'ordre n'est pas négociable : oxmysql fournit la base, ox_lib les
#  utilitaires, qbx_core le framework. Tout le reste en dépend.
#
#  ⚠️  ox_core est RETIRÉ. Ne jamais démarrer les deux ensemble :
#      ils se disputeraient la gestion des personnages.
# ───────────────────────────────────────────────────────────────────
    ensure oxmysql
    ensure ox_lib
    ensure qbx_core
    ensure ox_target
    ensure ox_inventory
    ensure illenium-appearance
    ensure pma-voice
    ensure ox_fuel

    # ensure ox_core   ← RETIRÉ, remplacé par qbx_core


# ───────────────────────────────────────────────────────────────────
#  ANTICHEAT
#  ⚠️  ElectronAC ne démarre pas : licence verrouillée sur une autre IP.
#      → https://electron-services.com/dashboard/anticheat/ip-unlock
#      Tant que ce n'est pas réglé, le serveur n'est PAS protégé.
# ───────────────────────────────────────────────────────────────────
    ensure ElectronAC


# ───────────────────────────────────────────────────────────────────
#  MLO / MAPPING / DÉCORS
# ───────────────────────────────────────────────────────────────────
    ensure bob74_ipl
    ensure [Bunkers]
    ensure [base_clan]
    ensure [Esthetiques]
    ensure [medical]
    ensure [Zone_trade]
    ensure [Cayo_Perico]
    ensure [Garage]
    ensure beer
    ensure Better_Zancudo
    ensure Better_Zancudo_MedicalPropsFix


# ───────────────────────────────────────────────────────────────────
#  VÊTEMENTS / VÉHICULES / ARMES
# ───────────────────────────────────────────────────────────────────
    ensure [Vetements]
    ensure Vehi_apocalypse
    ensure [Armes_mod]


# ───────────────────────────────────────────────────────────────────
#  OUTILS DE DÉVELOPPEMENT
#  ⚠️  À COMMENTER AVANT L'OUVERTURE PUBLIQUE
#      vMenu donne accès au spawn d'items et de véhicules : sur un
#      serveur survie, ça détruit l'économie de farming en une soirée.
# ───────────────────────────────────────────────────────────────────
    ensure ox_commands
    ensure dolu_tool
    ensure vMenu


# ───────────────────────────────────────────────────────────────────
#  SCRIPTS DE JEU
#  rz_core gère l'ambiance : monde vide et silence total.
#  Le script de zombies vit dans [Script] et doit démarrer AVANT
#  rz_safezone, qui lui déclare ses zones sans zombies.
# ───────────────────────────────────────────────────────────────────
    ensure rz_core

    # [Script] contient zombies ET ZSX_Multicharacter. Ce dossier doit
    # démarrer APRÈS qbx_core : ZSX attend son framework, et sans lui
    # il tourne dans le vide.
    ensure [Script]


# ═══════════════════════════════════════════════════════════════════
#  ▼▼▼  REDZONE — NOS RESSOURCES  ▼▼▼
#  Tout ce qui suit a été construit pour ce serveur.
#  Dépendent d'ox_lib, qbx_core, ox_inventory, ox_target et oxmysql,
#  d'où leur position après le bloc framework.
# ═══════════════════════════════════════════════════════════════════

    # Panneau admin — doit démarrer AVANT les outils qu'il ouvre,
    # sinon ses boutons visent des ressources encore absentes.
    ensure admin

    # Zones sûres — après [Script] pour trouver le script de zombies.
    # Sans lui, les zones fonctionnent quand même : seule la
    # suppression des zombies est perdue.
    ensure rz_safezone

    # Craft, progression, boîte aux lettres
    ensure rz_craft

    # Coffres de sécurité liés au joueur
    ensure rz_coffres

    # Usure des sacs à dos, à l'ouverture uniquement
    ensure rz_sacs

    # Fouille des épaves de décor de la map apocalyptique
    ensure rz_epaves

    # Signaux d'urgence sur les pagers.
    # Doit démarrer APRÈS [Script] : il pilote le script blackout.
    ensure rz_signal_urgences

    # Zone radioactive mobile.
    # Après rz_signal_urgences : elle lui délègue les avertissements.
    ensure rz_radioactivite

    # Outils admin
    ensure rz_props
    ensure rz_jobcreator
    ensure rz_adminjail
    ensure rz_reports

    # Fonctionne désormais : Qbox expose ses exports sous le nom
    # « qb-core » via son pont de compatibilité intégré, donc
    # exports['qb-core']:GetCoreObject() répond normalement.
    ensure rz_vip


# ───────────────────────────────────────────────────────────────────
#  HUD — TOUJOURS EN DERNIER
# ───────────────────────────────────────────────────────────────────
    ensure val-hud


# ═══════════════════════════════════════════════════════════════════
#  PERMISSIONS ACE
#
#  Pour trouver ta licence : connecte-toi puis tape `status` en
#  console serveur. Tu obtiendras une ligne du type
#  license:a1b2c3d4e5f6...
# ═══════════════════════════════════════════════════════════════════

    # ─── Groupe administrateur ─────────────────────────────────────
    add_ace group.admin rz_craft.admin      allow
    add_ace group.admin rz_safezone.admin   allow
    add_ace group.admin rz.jail             allow
    add_ace group.admin rz.props            allow
    add_ace group.admin rz.jobcreator       allow
    add_ace group.admin rz.staff            allow
    add_ace group.admin rz.vip              allow
    add_ace group.admin rz_coffres.admin    allow
    add_ace group.admin rz_signal.admin     allow
    add_ace group.admin rz_radiation.admin  allow

    # Qbox a son propre système de groupes, stocké en base. Ces ACE
    # restent utiles pour nos ressources, qui ne dépendent pas du
    # framework pour leurs permissions.

    # ─── Rattachement des personnes ────────────────────────────────
    # add_principal identifier.license:TA_LICENCE_ICI group.admin

    # ─── Rôles à venir ─────────────────────────────────────────────
    # Décommenter le jour où tu crées ces groupes. Aucune modification
    # de code ne sera nécessaire, les permissions sont déjà découpées.
    #
    # add_ace group.moderator rz_craft.view    allow
    # add_ace group.moderator rz.staff         allow
    # add_ace group.moderator rz_safezone.view allow
    #
    # add_ace group.support   rz_craft.mail    allow
    # add_ace group.support   rz.staff         allow
    # add_ace group.support   rz.coffres.give  allow   ← remise des coffres achetés
    # add_ace group.moderator rz.signal.announce allow ← annonces pager
