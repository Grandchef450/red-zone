    increase_pool_size "TxdStore" 6000              # Max: 26000
    # increase_pool_size "FragmentStore" 14000      # Max: 14000
    # increase_pool_size "StaticBounds" 5000        # Max: 5000
    # increase_pool_size "CMoveObject" 75           # Max: 75


# ═══════════════════════════════════════════════════════════════════
#  4 · CONVARS
#
#  Ces valeurs sont lues au DÉMARRAGE des ressources. Elles doivent
#  donc être posées avant tout `ensure`.
# ═══════════════════════════════════════════════════════════════════

# ─── Framework ─────────────────────────────────────────────────────
#  ox_inventory choisit son pont par ce convar. Sans cette ligne il
#  démarre en mode ESX et plus rien ne fonctionne.
#  ox_target, lui, détecte Qbox tout seul.
    setr inventory:framework "qbx"
    setr inventory:locale "fr"

#  Capacité de transport du joueur, en GRAMMES.
#  120 000 g garantit au moins 200 unités de n'importe quel matériau :
#  aucun item empilable ne dépasse 600 g.
    setr inventory:weight 120000


# ─── Loot de récupération ──────────────────────────────────────────
#  Format d'une entrée : ["item", minimum, maximum, chance en %]
#
#  À chaque fouille, ox_inventory tire de 0 à 3 items et lance un jet
#  séparé pour chacun. Une chance de 70 ne veut donc PAS dire 70 % de
#  trouver l'item : il faut d'abord qu'il soit tiré.
#
#  ⚠️  DEUX PIÈGES DE SYNTAXE
#   1. Chaque ligne doit rester sur UNE SEULE LIGNE. Un JSON coupé
#      sur plusieurs lignes n'est pas lu par FiveM.
#   2. Les guillemets internes sont échappés par \" — sans quoi le
#      parseur coupe la valeur au premier guillemet et le convar
#      arrive tronqué, sans la moindre erreur en console.

    # Épaves et véhicules abandonnés : pièces mécaniques et matériaux
    setr inventory:vehicleloot "[[\"ferraille\",1,3,70],[\"plastique\",1,3,65],[\"caoutchouc\",1,2,60],[\"fil_fer\",1,2,55],[\"tissu_use\",1,2,55],[\"ressort\",1,3,50],[\"verre\",1,2,45],[\"elastique\",1,2,40],[\"ruban_adhesif\",1,1,35],[\"tuyau_caoutchouc\",1,1,30],[\"tuyau_plastique\",1,1,30],[\"tube_cuivre\",1,1,25],[\"batterie_usee\",1,1,25],[\"bouteille_eau_sale\",1,1,20],[\"colle_construction\",1,1,15],[\"cle_molette\",1,1,12],[\"cle_cric\",1,1,10]]"

    # Poubelles et bennes : déchets domestiques, rares trouvailles
    setr inventory:dumpsterloot "[[\"carton\",1,3,75],[\"plastique\",1,3,70],[\"tissu_use\",1,2,60],[\"ficelle\",1,2,50],[\"bouteille_eau_sale\",1,2,45],[\"morceau_bois\",1,2,40],[\"verre\",1,2,40],[\"elastique\",1,2,35],[\"ferraille\",1,2,35],[\"chaussette_blanche\",1,1,30],[\"sel\",1,1,20],[\"cafe_colombien_sachet\",1,1,15],[\"cafe_moulu_sachet\",1,1,15],[\"aiguille_crochet\",1,1,12],[\"batterie_usee\",1,1,8],[\"collier_argent\",1,1,3],[\"bracelet_or\",1,1,2]]"

    setr inventory:randomloot 1

#  Minutes avant qu'une benne fouillée propose un nouveau tirage.
#  Défaut ox_inventory : 5, ce qui permet de camper trois poubelles
#  et de farmer sans jamais bouger.
#
#  ⚠️  Ne s'applique QU'AUX BENNES. Les coffres de véhicule sont
#      gérés par rz_core/server/loot.lua, dont la valeur
#      Config.LootRespawn.minutes doit rester alignée sur celle-ci.
    setr inventory:cleartime 45


# ─── Journalisation Discord ────────────────────────────────────────
#  Redirige TOUS les logs de l'écosystème ox — ox_inventory,
#  qbx_core, ox_target — vers rz_logs, qui les envoie sur Discord.
#
#  ⚠️  Exige le correctif de ox_lib/imports/logger/server.lua. Sans
#      lui, ox_lib ne connaît pas le service « discord » et n'envoie
#      rien du tout, sans la moindre erreur en console.
    setr ox:logger "discord"

#  Niveau de détail d'ox_inventory :
#    0 = rien
#    1 = transferts entre inventaires
#    2 = tout, y compris les AddItem et RemoveItem des scripts
#        → c'est ce niveau qui capture les /giveitem du staff
    setr inventory:loglevel 2


