# ═══════════════════════════════════════════════════════════════════
#  11 · AMBIANCE ET SCRIPTS TIERS
# ═══════════════════════════════════════════════════════════════════

#  rz_core : monde vide et silence total. Densité de trafic, de
#  passants et de scénarios à zéro, radios et dispatch coupés.
    ensure rz_core

#  [Script] regroupe zombies, ZSX_Multicharacter, [Apo_Script]
#  (blackout et pager), [lunar], [Wasabi] et gfx-lumberjack.
#
#  APRÈS qbx_core : ZSX attend son framework et tourne dans le vide
#  sans lui. AVANT rz_safezone, qui déclare ses zones au script de
#  zombies.
#
#  ⚠️  À retirer de ce dossier : menu-fps (remplacé par rz_fps),
#      deathscreen (intégré à rz_mort), Car_Inventory (mod solo qui
#      n'a jamais démarré).
    ensure [Script]


# ═══════════════════════════════════════════════════════════════════
#
#   ▼▼▼   R E D Z O N E   —   N O S   R E S S O U R C E S   ▼▼▼
#
#   Tout ce qui suit a été construit pour ce serveur.
#   Dépend d'ox_lib, qbx_core, ox_inventory, ox_target et oxmysql,
