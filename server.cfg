# ═══════════════════════════════════════════════════════════════════
#  6 · FRAMEWORK — L'ORDRE EST CRITIQUE
#
#  oxmysql avant tout : ox_lib et qbx_core l'interrogent au
#  démarrage. qbx_core avant ox_inventory, qui a besoin du framework
#  pour identifier les joueurs.
#
#  Inverser deux lignes ici, c'est un serveur qui démarre sans
#  inventaire et sans personnages.
# ═══════════════════════════════════════════════════════════════════
    ensure oxmysql
    ensure ox_lib
    ensure qbx_core
    ensure ox_target
    ensure ox_inventory
    ensure illenium-appearance
    ensure pma-voice
    ensure ox_fuel

    # ensure ox_core   ← RETIRÉ, remplacé par qbx_core.
    #                    Le dossier doit être SORTI de resources :
    #                    deux frameworks qui cohabitent se disputent
    #                    les mêmes évènements.


# ═══════════════════════════════════════════════════════════════════
#  7 · ANTICHEAT
#
#  ⚠️  Licence verrouillée sur une autre IP. Tant que ce n'est pas
#      débloqué, la ressource ne démarre pas — et tout script qui la
#      déclare en dépendance échoue avec elle.
#      https://electron-services.com/dashboard/anticheat/ip-unlock
# ═══════════════════════════════════════════════════════════════════
    ensure ElectronAC


