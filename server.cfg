# ─── INFRASTRUCTURE ────────────────────────────────────────────────
#  En premier : les autres ressources s'appuient dessus.

#  Journalisation Discord. Toutes les ressources lui envoient leurs
#  logs, y compris ox_inventory via le correctif d'ox_lib.
    ensure rz_logs

#  Grades du staff et filtrage des boutons du menu admin.
#  AVANT « admin », qui l'interroge à l'ouverture pour savoir quels
#  boutons afficher et lesquels griser.
    ensure rz_perms


# ─── PANNEAU ADMIN ─────────────────────────────────────────────────
#  AVANT les outils qu'il ouvre : ses boutons visent des ressources
#  qui doivent déjà exister au moment où il construit son menu.
    ensure admin


# ─── MONDE ET ÉCONOMIE ─────────────────────────────────────────────

#  Zones sûres. Après [Script] pour trouver le script de zombies :
#  sans lui les zones fonctionnent quand même, seule la suppression
#  des zombies est perdue.
    ensure rz_safezone

#  Craft, progression par catégorie, boîte aux lettres
    ensure rz_craft

#  Coffres de sécurité liés au joueur, à durée limitée
    ensure rz_coffres

#  Usure des sacs à dos, à l'ouverture uniquement
    ensure rz_sacs

#  Fouille des épaves de décor de la map apocalyptique
    ensure rz_epaves


# ─── ÉVÉNEMENTS ────────────────────────────────────────────────────

#  Signaux d'urgence sur les pagers.
#  APRÈS [Script] : il pilote le script blackout par commande.
    ensure rz_signal_urgences

#  Zone radioactive mobile.
#  APRÈS rz_signal_urgences : elle lui délègue les avertissements.
    ensure rz_radioactivite


# ─── MORT ──────────────────────────────────────────────────────────
#  EN DERNIER parmi les rz_ : interroge rz_safezone pour le point de
#  réapparition, et rz_coffres pour savoir quels slots ne doivent
#  pas tomber.
#
#  L'écran de mort de « deathscreen » y est intégré : cette
#  ressource peut être supprimée du dossier resources.
    ensure rz_mort


# ─── OUTILS ADMIN REPRIS ───────────────────────────────────────────
    ensure rz_props
    ensure rz_jobcreator
    ensure rz_adminjail
    ensure rz_reports

#  Fonctionne désormais : Qbox expose ses exports sous le nom
#  « qb-core » via son pont de compatibilité, donc
#  exports['qb-core']:GetCoreObject() répond normalement.
    ensure rz_vip


# ─── CÔTÉ JOUEUR ───────────────────────────────────────────────────
#  Profils graphiques et compteur de FPS.
#  Remplace « menu-fps », qui peut être retiré du dossier.
    ensure rz_fps


# ═══════════════════════════════════════════════════════════════════
#  12 · HUD — TOUJOURS EN DERNIER
#
#  val-hud lit l'état de l'inventaire et du framework au démarrage.
#  Placé plus haut, il s'initialise sur des valeurs vides et affiche
#  des jauges figées.
#
#  ⚠️  Dans val-hud/config.lua : Config.FrameWork = 'qb'
# ═══════════════════════════════════════════════════════════════════
    ensure val-hud


# ═══════════════════════════════════════════════════════════════════
#  PERMISSIONS — LES QUATRE GRADES
#
#  Le découpage suit trois familles d'usage :
#
#    CONSTRUIRE   établis, recettes, zones, loot, radioactivité.
#                 Ça façonne le serveur.
#    ARBITRER     réanimer, statistiques de tir, prison, reports.
#                 Ça règle des situations entre joueurs.
#    DÉPANNER     colis, coffres, VIP.
#                 Ça répare ce qui a mal tourné.
#
#  Pour trouver la licence d'un joueur : qu'il se connecte, puis
#  tape `status` en console serveur.
# ═══════════════════════════════════════════════════════════════════


# ───────────────────────────────────────────────────────────────────
#  DÉVELOPPEUR — tout, sans exception
# ───────────────────────────────────────────────────────────────────
    add_ace group.developpeur rz_craft.admin        allow
    add_ace group.developpeur rz_safezone.admin     allow
    add_ace group.developpeur rz_coffres.admin      allow
    add_ace group.developpeur rz_epaves.admin       allow
    add_ace group.developpeur rz_signal.admin       allow
    add_ace group.developpeur rz_radiation.admin    allow
    add_ace group.developpeur rz_mort.admin         allow

    add_ace group.developpeur rz_craft.edit         allow
    add_ace group.developpeur rz_craft.view         allow
    add_ace group.developpeur rz_craft.mail         allow
    add_ace group.developpeur rz_safezone.edit      allow
    add_ace group.developpeur rz_safezone.view      allow
    add_ace group.developpeur rz.coffres.give       allow
    add_ace group.developpeur rz.signal.announce    allow
    add_ace group.developpeur rz.signal.network     allow
    add_ace group.developpeur rz.radiation          allow
    add_ace group.developpeur rz.mort               allow
    add_ace group.developpeur rz.staff              allow
    add_ace group.developpeur rz.props              allow
    add_ace group.developpeur rz.jobcreator         allow
    add_ace group.developpeur rz.jail               allow
    add_ace group.developpeur rz.vip                allow
    add_ace group.developpeur rz_perms.manage       allow

#   rz_perms.manage donne le droit d'accorder des grades. Il reste
#   au seul développeur : promouvoir quelqu'un, c'est pouvoir se
#   promouvoir soi-même.


# ───────────────────────────────────────────────────────────────────
#  ADMIN — tout, sauf les réglages d'équilibrage global
#
#  Le loot des épaves et le rayon de la zone radioactive restent
#  chez le développeur. Un curseur bougé un soir change l'économie
#  du serveur sans que personne sache pourquoi trois semaines plus
#  tard.
# ───────────────────────────────────────────────────────────────────
    add_ace group.admin rz_craft.admin              allow
    add_ace group.admin rz_safezone.admin           allow
    add_ace group.admin rz_coffres.admin            allow
    add_ace group.admin rz_signal.admin             allow
    add_ace group.admin rz_mort.admin               allow

    add_ace group.admin rz_craft.edit               allow
    add_ace group.admin rz_craft.view               allow
    add_ace group.admin rz_craft.mail               allow
    add_ace group.admin rz_safezone.edit            allow
    add_ace group.admin rz_safezone.view            allow
    add_ace group.admin rz.coffres.give             allow
    add_ace group.admin rz.signal.announce          allow
    add_ace group.admin rz.signal.network           allow
    add_ace group.admin rz.mort                     allow
    add_ace group.admin rz.staff                    allow
    add_ace group.admin rz.props                    allow
    add_ace group.admin rz.jobcreator               allow
    add_ace group.admin rz.jail                     allow
    add_ace group.admin rz.vip                      allow

#   Volontairement NON accordés à l'admin :
#     rz_epaves.admin    — équilibrage du loot
#     rz.radiation       — rayon et vitesse de la zone


# ───────────────────────────────────────────────────────────────────
#  MODÉRATEUR — arbitrer, sans modifier le monde
# ───────────────────────────────────────────────────────────────────
    add_ace group.moderateur rz.mort                allow
    add_ace group.moderateur rz_safezone.view       allow
    add_ace group.moderateur rz_craft.view          allow
    add_ace group.moderateur rz.jail                allow
    add_ace group.moderateur rz.staff               allow
    add_ace group.moderateur rz.signal.announce     allow

#   Volontairement NON accordé :
#     rz.signal.network  — couper le courant d'une ville est un
#                          événement de jeu, pas une sanction


# ───────────────────────────────────────────────────────────────────
#  SUPPORT — dépanner un joueur
# ───────────────────────────────────────────────────────────────────
    add_ace group.support rz.coffres.give           allow
    add_ace group.support rz_craft.mail             allow
    add_ace group.support rz.staff                  allow
    add_ace group.support rz.vip                    allow


# ───────────────────────────────────────────────────────────────────
#  RATTACHEMENT DES PERSONNES
#
#  Une ligne par membre du staff. Décommente et remplace la licence.
# ───────────────────────────────────────────────────────────────────
#  Ta ligne est ACTIVE : c'est ton accès de secours. Si la base
#  tombe ou que rz_perms refuse de démarrer, tu gardes la main.
    add_principal identifier.license:ee27acd60d248c7a8cbfb82ce4f8779bca3a6980 group.developpeur

#  Les autres passent par le menu F5 → Équipe, pas par ce fichier.
#   add_principal identifier.license:XXXXXXXXXX group.admin
#   add_principal identifier.license:XXXXXXXXXX group.moderateur
#   add_principal identifier.license:XXXXXXXXXX group.support


# ───────────────────────────────────────────────────────────────────
#  HÉRITAGE
#
#  Un développeur possède tout ce qu'a un admin, qui possède tout
#  ce qu'a un modérateur. Ces trois lignes évitent de dupliquer les
#  droits et garantissent qu'un ajout futur descend la hiérarchie.
# ───────────────────────────────────────────────────────────────────
    add_principal group.developpeur group.admin
    add_principal group.admin       group.moderateur
    add_principal group.moderateur  group.support
