# ═══════════════════════════════════════════════════════════════════
#  REDZONE SURVIVAL — server.cfg
#  Version corrigée — 26 août 2026
#  Build FiveM : 3570 (Money Fronts)
#  Framework   : ox_core
# ═══════════════════════════════════════════════════════════════════


# ───────────────────────────────────────────────────────────────────
#  IDENTITÉ DU SERVEUR
# ───────────────────────────────────────────────────────────────────
    sv_hostname "RedZone Survival / Loot / Craft - Serveur Post-Apocalyptique"
    sets sv_projectName "RedZone Survival"
    sets sv_projectDesc "RedZone — La Survie Humaine dépend de vous"
    sets locale "fr-CA"

    sets Fondateur "GrandchefStream"
    sets Developpeur "VoigthQC"
    sets Discord "https://discord.gg/KtxyBudf"

    sets tags "custom, fr, qc, survival, post-apocalyptique, craft, zombies"

    sets banner_detail "https://i.postimg.cc/vTB17b0f/Redzone_ban.png"
    sets banner_connecting "https://i.postimg.cc/5y60YptB/redzone-rond-logo.png"
    load_server_icon redzone_logo.png


# ───────────────────────────────────────────────────────────────────
#  RÉSEAU ET LICENCE
#  ⚠️  NE JAMAIS COMMIT CE FICHIER AVEC LES VRAIES VALEURS
# ───────────────────────────────────────────────────────────────────
    sv_licenseKey "XXXXX"
    set steam_webApiKey "XXXXX"

    sv_enforceGameBuild 3570

    # ⚠️  MODE DÉVELOPPEMENT — À CHANGER AVANT L'OUVERTURE PUBLIQUE
    sv_lan 1                # → mettre 0 pour autoriser les connexions extérieures
    sv_maxclients 4         # → monter à 32/48/64 selon ton hébergement

    endpoint_add_tcp "0.0.0.0:31120"
    endpoint_add_udp "0.0.0.0:31120"

    set resources_useSystemChat true

    # OneSync : à activer dans l'onglet Settings de txAdmin, PAS ici.
    # Obligatoire pour un serveur survie (zombies, entités, state awareness).


# ───────────────────────────────────────────────────────────────────
#  POOLS MÉMOIRE
#  À augmenter si tu vois des props/MLO qui ne s'affichent pas.
# ───────────────────────────────────────────────────────────────────
    increase_pool_size "TxdStore" 6000              # Max: 26000
    # increase_pool_size "FragmentStore" 14000      # Max: 14000
    # increase_pool_size "StaticBounds" 5000        # Max: 5000
    # increase_pool_size "CMoveObject" 75           # Max: 75


# ───────────────────────────────────────────────────────────────────
#  BASE FIVEM
# ───────────────────────────────────────────────────────────────────
    ensure mapmanager
    ensure chat
    ensure sessionmanager
    ensure hardcap
    # ensure spawnmanager      # désactivé : ZSX_Multicharacter gère le spawn
    # ensure basic-gamemode    # désactivé : incompatible avec un framework


# ───────────────────────────────────────────────────────────────────
#  PERMISSIONS
#  CORRIGÉ : le chemin @ressource/ est obligatoire, sinon FiveM
#  cherche le fichier à la racine du serveur et l'exec échoue
#  silencieusement (= aucune permission chargée).
# ───────────────────────────────────────────────────────────────────
    exec @vMenu/config/permissions.cfg

    # exec redzone.cfg
    # ↑ RETIRÉ : ce fichier n'existe nulle part.
    #   Si tu veux y mettre tes ACE perms admin, crée-le à la racine
    #   du serveur (à côté de server.cfg) puis décommente cette ligne.


# ───────────────────────────────────────────────────────────────────
#  FRAMEWORK OX — DOIT DÉMARRER AVANT TOUT SCRIPT
#  L'ordre ci-dessous n'est pas négociable : oxmysql fournit la BDD,
#  ox_lib les utilitaires, ox_core le framework. Tout le reste en dépend.
# ───────────────────────────────────────────────────────────────────
    ensure oxmysql
    ensure ox_lib
    ensure ox_core
    ensure ox_target
    ensure ox_inventory
    ensure illenium-appearance
    ensure pma-voice
    ensure ox_fuel


# ───────────────────────────────────────────────────────────────────
#  ANTICHEAT
#  ⚠️  ElectronAC ne démarre pas : licence verrouillée sur une autre IP.
#      → https://electron-services.com/dashboard/anticheat/ip-unlock
#      Tant que ce n'est pas réglé, le serveur n'est PAS protégé.
# ───────────────────────────────────────────────────────────────────
    ensure ElectronAC


# ───────────────────────────────────────────────────────────────────
#  MLO / MAPPING / DÉCORS
# ───────────────────────────────────────────────────────────────────
    ensure bob74_ipl
    ensure [Bunkers]
    ensure [base_clan]
    ensure [Esthetiques]
    ensure [medical]
    ensure [Zone_trade]
    ensure [Cayo_Perico]
    ensure [Garage]
    ensure beer
    ensure Better_Zancudo
    ensure Better_Zancudo_MedicalPropsFix

    # ensure Blaine_County_caravan
    # ↑ RETIRÉ : ressource introuvable, n'a jamais démarré.

    # ensure Quin Yar Village
    # ↑ RETIRÉ : introuvable ET nom invalide.
    #   Un nom avec espaces est lu comme 3 arguments par FiveM.
    #   Si tu la remets un jour : renomme le dossier Quin_Yar_Village.


# ───────────────────────────────────────────────────────────────────
#  VÊTEMENTS / VÉHICULES / ARMES
# ───────────────────────────────────────────────────────────────────
    ensure [Vetements]
    ensure Vehi_apocalypse
    ensure [Armes_mod]

    # ensure [voice]
    # ↑ RETIRÉ : ce dossier n'existe pas.
    #   La voix, c'est pma-voice, déjà démarré plus haut.


# ───────────────────────────────────────────────────────────────────
#  OUTILS ADMIN / DÉVELOPPEMENT
#  ⚠️  À COMMENTER AVANT L'OUVERTURE PUBLIQUE
#      vMenu donne accès au spawn d'items et de véhicules : sur un
#      serveur survie, ça détruit l'économie de farming en une soirée.
# ───────────────────────────────────────────────────────────────────
    ensure ox_commands
    ensure dolu_tool
    ensure vMenu


# ───────────────────────────────────────────────────────────────────
#  SCRIPTS DE JEU
# ───────────────────────────────────────────────────────────────────
    ensure vqc_core
    ensure [Script]

    # ensure [lunar]
    # ensure [Wasabi]
    # ensure [zsx]
    # ↑ REDONDANT : ces 3 dossiers sont DANS [Script], déjà couverts.
